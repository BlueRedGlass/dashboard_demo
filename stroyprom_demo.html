<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>СтройПром · Операционный центр продаж</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f4f4f1;
  --paper:#ffffff;
  --ink:#0f172a;
  --ink-2:#1e293b;
  --ink-3:#475569;
  --ink-4:#64748b;
  --line:#0f172a;
  --hair:#e2e1dc;
  --hair-2:#d4d3cc;
  --amber:#b45309;
  --amber-bg:#fef3c7;
  --amber-light:#fef9e7;
  --red:#991b1b;
  --red-bg:#fee2e2;
  --red-light:#fef2f2;
  --green:#14532d;
  --green-bg:#dcfce7;
  --green-light:#f0fdf4;
  --blue:#1e3a5f;
  --blue-bg:#dbeafe;
  --steel:#334155;
}
html{scroll-behavior:smooth}
body{
  font-family:'Manrope',-apple-system,sans-serif;
  background:var(--bg);
  color:var(--ink);
  font-size:13px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-weight:400;
}
.mono{font-family:'JetBrains Mono',monospace;font-feature-settings:"tnum","ss01"}

.hdr{
  background:linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
  color:#f4f4f1;
  padding:14px 24px 0;
  position:relative;
}
.hdr::after{
  content:"";
  position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg, transparent, #475569, transparent);
}
.hdr-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.brand{display:flex;align-items:center;gap:14px}
.brand-mark{
  width:36px;height:36px;
  background:#b45309;
  display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono';font-weight:700;font-size:18px;color:#0f172a;
  border-radius:2px;
  letter-spacing:-1px;
}
.brand-text{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:#94a3b8;font-weight:600;margin-bottom:2px}
.brand-title{font-size:18px;font-weight:700;letter-spacing:-0.01em}
.brand-title span{color:#fbbf24}
.live-wrap{text-align:right;font-size:10px;color:#94a3b8;letter-spacing:1px;text-transform:uppercase;font-weight:500}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#22c55e;margin-right:5px;animation:pulse 2s infinite;box-shadow:0 0 6px #22c55e}
.last-upd{color:#cbd5e1;margin-top:3px;font-family:'JetBrains Mono';font-size:11px;letter-spacing:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.nav{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid transparent}
.nav button{
  padding:9px 18px;
  border:none;
  font-size:11px;font-weight:600;
  cursor:pointer;
  font-family:inherit;
  transition:all .15s;
  background:transparent;
  color:#94a3b8;
  letter-spacing:.5px;
  text-transform:uppercase;
  position:relative;
  white-space:nowrap;
}
.nav button:hover{color:#f4f4f1}
.nav .on{color:#fbbf24}
.nav .on::after{
  content:"";
  position:absolute;left:18px;right:18px;bottom:-1px;height:2px;
  background:#fbbf24;z-index:2;
}

.fbar{padding:11px 24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--hair);background:var(--paper)}
.fbar label{font-size:9px;color:var(--ink-4);font-weight:700;text-transform:uppercase;letter-spacing:1.2px}
.fbar select,.fbar input{
  padding:6px 11px;
  border:1px solid var(--hair-2);
  font-size:12px;
  font-family:inherit;
  background:#fff;
  color:var(--ink);
  border-radius:2px;
}
.fbar input[type=text]{width:200px}
.per-btn{
  padding:5px 11px;
  border:1px solid var(--hair-2);
  font-size:10px;
  cursor:pointer;
  font-family:inherit;
  background:#fff;
  color:var(--ink-3);
  letter-spacing:.5px;
  font-weight:600;
  border-radius:2px;
  text-transform:uppercase;
  transition:all .15s;
}
.per-btn:hover{border-color:var(--ink-3)}
.per-btn.on{background:var(--ink);color:#fbbf24;border-color:var(--ink)}
.export-btn{
  margin-left:auto;
  padding:6px 14px;
  border:1px solid var(--green);
  background:var(--green-light);
  color:var(--green);
  font-size:10px;cursor:pointer;font-family:inherit;
  font-weight:700;letter-spacing:1px;
  text-transform:uppercase;
  border-radius:2px;
  transition:all .15s;
}
.export-btn:hover{background:var(--green);color:#fff}

.page{padding:18px 24px 50px;display:none}
.page.show{display:block}

/* SUMMARY VIEW */
.banner{
  background:linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
  color:#f4f4f1;
  padding:24px 28px;
  margin-bottom:18px;
  position:relative;
  overflow:hidden;
}
.banner::before{
  content:"";
  position:absolute;
  top:0;right:0;
  width:240px;height:240px;
  background:radial-gradient(circle, #b4530933 0%, transparent 70%);
}
.banner-row{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:18px;position:relative;z-index:1}
.banner-l{display:flex;flex-direction:column;gap:6px}
.banner-eyebrow{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#94a3b8;font-weight:600}
.banner-h{font-size:34px;font-weight:800;letter-spacing:-0.02em;line-height:1}
.banner-h span{color:#fbbf24}
.banner-sub{font-size:13px;color:#cbd5e1;margin-top:4px;font-weight:400}
.banner-r{display:flex;gap:28px;flex-wrap:wrap}
.bstat{text-align:right}
.bstat-l{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:#94a3b8;font-weight:600;margin-bottom:3px}
.bstat-v{font-family:'JetBrains Mono';font-size:24px;font-weight:600;letter-spacing:-0.02em;color:#fbbf24}

.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0;margin-bottom:18px;background:var(--paper);border:1px solid var(--hair)}
.kpi{
  padding:18px 20px;
  border-right:1px solid var(--hair);
  position:relative;
}
.kpi:last-child{border-right:none}
.kpi-l{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--ink-4);margin-bottom:5px}
.kpi-v{font-family:'JetBrains Mono';font-size:26px;font-weight:600;letter-spacing:-0.02em;color:var(--ink);line-height:1.1}
.kpi-v.green{color:var(--green)}
.kpi-v.red{color:var(--red)}
.kpi-v.amber{color:var(--amber)}
.kpi-s{font-size:11px;color:var(--ink-4);margin-top:5px;font-weight:500}
.kpi-trend{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:2px 6px;border-radius:2px;margin-top:5px;font-family:'JetBrains Mono'}
.kpi-trend.up{background:var(--green-bg);color:var(--green)}
.kpi-trend.down{background:var(--red-bg);color:var(--red)}

/* LOSS BANNER */
.loss-block{
  background:var(--paper);
  border:1px solid var(--hair);
  padding:22px 24px;
  margin-bottom:18px;
  display:grid;
  grid-template-columns:auto 1fr;
  gap:32px;
  align-items:center;
}
.loss-side{
  border-right:1px solid var(--hair);
  padding-right:32px;
}
.loss-side-l{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--red);font-weight:700;margin-bottom:5px}
.loss-side-v{font-family:'JetBrains Mono';font-size:42px;font-weight:700;letter-spacing:-0.02em;color:var(--red);line-height:1}
.loss-side-s{font-size:11px;color:var(--ink-3);margin-top:6px;line-height:1.4;max-width:200px}
.loss-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.loss-item{padding:0 12px;border-left:2px solid var(--amber)}
.loss-item-l{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-4);font-weight:700;margin-bottom:4px}
.loss-item-v{font-family:'JetBrains Mono';font-size:18px;font-weight:600;color:var(--amber);margin-bottom:4px}
.loss-item-s{font-size:11px;color:var(--ink-3);line-height:1.4}

.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-bottom:18px}
@media(max-width:920px){.two-col{grid-template-columns:1fr}}
.card{background:var(--paper);border:1px solid var(--hair)}
.card-h{padding:13px 18px;border-bottom:1px solid var(--hair);display:flex;justify-content:space-between;align-items:center}
.card-t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--ink)}
.card-meta{font-size:10px;color:var(--ink-4);font-weight:500}
.card-b{padding:14px 18px}

table{width:100%;border-collapse:collapse;font-size:12px}
th{
  padding:9px 8px;
  font-size:9px;font-weight:700;
  text-transform:uppercase;letter-spacing:1px;
  color:var(--ink-4);
  background:#fafaf6;
  cursor:pointer;user-select:none;
  white-space:nowrap;
  border-bottom:1px solid var(--hair-2);
  border-top:1px solid var(--hair);
  text-align:left;
}
th.right{text-align:right}
th:hover{color:var(--ink)}
td{padding:9px 8px;border-bottom:1px solid var(--hair);color:var(--ink-2)}
td.right{text-align:right}
td.num{font-family:'JetBrains Mono';font-weight:500}
tbody tr:hover{background:#fafaf6}
tfoot td{font-weight:700;background:#fafaf6;border-top:2px solid var(--ink);border-bottom:none;color:var(--ink);padding-top:11px}
.pill{display:inline-block;padding:2px 7px;border-radius:2px;font-size:9px;font-weight:700;letter-spacing:.5px;font-family:'JetBrains Mono'}
.pill.a{background:var(--green-bg);color:var(--green)}
.pill.b{background:var(--amber-bg);color:var(--amber)}
.pill.c{background:#f1f5f9;color:var(--ink-3)}
.pill.red{background:var(--red-bg);color:var(--red)}
.pill.green{background:var(--green-bg);color:var(--green)}

.alrt{
  padding:10px 14px;
  font-size:12px;
  display:flex;align-items:flex-start;gap:10px;
  border-bottom:1px solid var(--hair);
  cursor:default;
}
.alrt:last-child{border-bottom:none}
.alrt:hover{background:#fafaf6}
.alrt-icon{
  font-family:'JetBrains Mono';font-weight:700;font-size:10px;
  padding:2px 6px;border-radius:2px;flex-shrink:0;margin-top:1px;
}
.alrt.r .alrt-icon{background:var(--red-bg);color:var(--red)}
.alrt.y .alrt-icon{background:var(--amber-bg);color:var(--amber)}
.alrt-msg{flex:1;line-height:1.4}
.alrt-msg b{color:var(--ink)}

/* MONTH CHART */
.chart-wrap{padding:6px 4px}
.bars{display:flex;align-items:flex-end;gap:6px;height:160px;margin:14px 4px 8px;padding-bottom:6px;border-bottom:1px solid var(--hair-2)}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;height:100%;justify-content:flex-end}
.bar{width:100%;background:linear-gradient(180deg, var(--ink-2) 0%, var(--ink) 100%);position:relative;min-height:2px;transition:all .25s}
.bar.low{background:linear-gradient(180deg, #b45309 0%, #92400e 100%)}
.bar.high{background:linear-gradient(180deg, #14532d 0%, #052e16 100%)}
.bar:hover{filter:brightness(1.2)}
.bar-val{font-family:'JetBrains Mono';font-size:9px;color:var(--ink-3);position:absolute;top:-14px;left:50%;transform:translateX(-50%);white-space:nowrap;font-weight:600}
.bar-lbl{font-size:10px;color:var(--ink-4);font-weight:600}
.avg-line{position:absolute;left:4px;right:4px;border-top:1px dashed var(--ink-3);pointer-events:none;z-index:1}
.avg-lbl{position:absolute;right:6px;font-size:9px;color:var(--ink-3);background:var(--paper);padding:0 4px;font-family:'JetBrains Mono';font-weight:600;top:-7px}

.chart-cap{font-size:10px;color:var(--ink-4);text-align:center;margin-top:4px;font-style:italic}

/* CATEGORY BREAKDOWN */
.cat-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--hair);font-size:12px}
.cat-row:last-child{border-bottom:none}
.cat-name{flex:0 0 145px;font-weight:600;color:var(--ink-2)}
.cat-bar-wrap{flex:1;height:18px;background:#f1f5f9;position:relative;border-radius:1px;overflow:hidden}
.cat-bar{height:100%;background:linear-gradient(90deg, var(--ink-2), var(--ink));position:relative}
.cat-bar-lbl{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:10px;color:#fff;font-weight:600;font-family:'JetBrains Mono';mix-blend-mode:difference}
.cat-val{flex:0 0 95px;text-align:right;font-family:'JetBrains Mono';font-size:12px;font-weight:600;color:var(--ink)}
.cat-pct{flex:0 0 50px;text-align:right;font-size:11px;color:var(--ink-4);font-family:'JetBrains Mono'}

/* SKU DETAIL */
.sku-h{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--hair-2);margin-bottom:18px}
.sku-tit{font-size:22px;font-weight:700;letter-spacing:-0.01em}
.sku-sub{font-size:12px;color:var(--ink-4);margin-top:3px}
.sku-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--hair);background:var(--paper)}
.sku-blk{padding:16px 18px;border-right:1px solid var(--hair)}
.sku-blk:last-child{border-right:none}
.sku-blk-t{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;font-weight:700;color:var(--ink-4);margin-bottom:11px;padding-bottom:8px;border-bottom:1px solid var(--hair)}
.sku-r{display:flex;justify-content:space-between;padding:4px 0;font-size:12px}
.sku-r .l{color:var(--ink-4)}
.sku-r .v{font-weight:600;color:var(--ink);font-family:'JetBrains Mono'}
.sku-r .v.red{color:var(--red)}
.sku-r .v.green{color:var(--green)}
.sku-r .v.amber{color:var(--amber)}

.ftr{padding:16px 24px;text-align:center;font-size:9px;color:var(--ink-4);letter-spacing:2px;text-transform:uppercase;border-top:1px solid var(--hair);background:var(--paper);font-weight:600}
.ftr span{color:var(--amber);font-weight:700}

@media(max-width:760px){
  .banner-h{font-size:24px}
  .loss-block{grid-template-columns:1fr;gap:18px}
  .loss-side{border-right:none;border-bottom:1px solid var(--hair);padding-right:0;padding-bottom:18px}
  .loss-grid{grid-template-columns:1fr}
  .sku-grid{grid-template-columns:1fr}
  .sku-blk{border-right:none;border-bottom:1px solid var(--hair)}
}

.search-input::placeholder{color:#b5b3a8;font-style:italic}
</style>
</head>

const fmt = n => n == null || isNaN(n) ? "—" : Math.round(n).toLocaleString("ru-RU");
const fR = n => n == null || isNaN(n) ? "—" : fmt(n) + " ₽";
const fK = n => n == null || isNaN(n) ? "—" : n >= 1000000 ? (n/1000000).toFixed(1) + " млн ₽" : Math.round(n/1000) + " тыс ₽";
const fP = n => n == null || isNaN(n) ? "—" : n.toFixed(1) + "%";

let period = "year", catF = "all", chF = "all", mgrF = "all", searchF = "";
let cur = 0;

const pages = ["Сводка", "Продукты", "Менеджеры", "Каналы"];

const MONTHS = ["Янв", "Фев", "Мар", "Апр", "Май", "Июн", "Июл", "Авг", "Сен", "Окт", "Ноя", "Дек"];

function getFiltered() {
  return TXNS.filter(t =>
    (catF === "all" || t.cat === catF) &&
    (chF === "all" || t.ch === chF) &&
    (mgrF === "all" || t.mgr === mgrF) &&
    (searchF === "" || t.prod.toLowerCase().includes(searchF.toLowerCase()))
  );
}

function agg(arr) {
  const r = {rev:0, cost:0, profit:0, qty:0, deals:arr.length};
  for (const t of arr) { r.rev+=t.rev; r.cost+=t.cost; r.profit+=t.profit; r.qty+=t.qty; }
  r.margin = r.rev > 0 ? r.profit / r.rev * 100 : 0;
  r.avgCheck = r.deals > 0 ? r.rev / r.deals : 0;
  return r;
}

function calcLossPotential(arr) {
  // 1. Сезонные провалы — упущенная выручка относительно среднемесячного
  const months = {};
  for (const t of arr) {
    if (!months[t.m]) months[t.m] = 0;
    months[t.m] += t.rev;
  }
  const monthlyVals = Object.values(months);
  const avg = monthlyVals.reduce((a,b)=>a+b,0) / monthlyVals.length;
  let seasonalLoss = 0;
  for (const v of monthlyVals) {
    if (v < avg * 0.9) seasonalLoss += avg - v;
  }
  
  // 2. Перекос в каналах — недозагрузка розницы относительно опта
  const channels = {};
  for (const t of arr) {
    if (!channels[t.ch]) channels[t.ch] = 0;
    channels[t.ch] += t.rev;
  }
  // Если розница меньше 15% от опта — это перекос
  const opt = channels["Оптовый отдел"] || 0;
  const ret = channels["Розничная точка"] || 0;
  let channelLoss = 0;
  if (opt > 0 && ret < opt * 0.5) {
    channelLoss = opt * 0.5 - ret; // условный недобор розницы до 50% от опта
  }
  
  // 3. Слабый хвост ассортимента — недопродажа маржинальных C-категорий
  const products = {};
  for (const t of arr) {
    if (!products[t.prod]) products[t.prod] = {rev:0, margin:0, count:0};
    products[t.prod].rev += t.rev;
    products[t.prod].margin += t.margin;
    products[t.prod].count += 1;
  }
  for (const p in products) {
    products[p].avgMargin = products[p].margin / products[p].count;
  }
  // Топ-1 продукт по выручке для бенчмарка
  const sortedByRev = Object.entries(products).sort((a,b) => b[1].rev - a[1].rev);
  const topRev = sortedByRev[0] ? sortedByRev[0][1].rev : 0;
  // Найти продукты с маржей >= 45% но выручкой <5% от топа
  let tailLoss = 0;
  for (const [p, data] of sortedByRev) {
    if (data.avgMargin >= 45 && data.rev < topRev * 0.05) {
      // условная упущенная выручка — до 15% от топа
      tailLoss += topRev * 0.15 - data.rev;
    }
  }
  
  return {
    seasonalLoss: Math.max(0, seasonalLoss),
    channelLoss: Math.max(0, channelLoss),
    tailLoss: Math.max(0, tailLoss),
    total: seasonalLoss + channelLoss + tailLoss
  };
}

function cats() {
  return [...new Set(TXNS.map(t => t.cat))].sort();
}
function chs() {
  return [...new Set(TXNS.map(t => t.ch))].sort();
}
function mgrs() {
  return [...new Set(TXNS.map(t => t.mgr))].sort();
}

function renderNav() {
  const n = document.getElementById("nav");
  n.innerHTML = "";
  pages.forEach((p, i) => {
    const b = document.createElement("button");
    b.textContent = p;
    b.className = i === cur ? "on" : "";
    b.onclick = () => { cur = i; renderNav(); showPage(); renderAll(); };
    n.appendChild(b);
  });
}
function showPage() {
  [0,1,2,3].forEach(i => {
    document.getElementById("p"+i).className = "page" + (i === cur ? " show" : "");
  });
}

function exportToExcel() {
  const f = getFiltered();
  const rows = f.map(t => ({
    "Дата": t.d,
    "Категория": t.cat,
    "Продукт": t.prod,
    "Кол-во": t.qty,
    "Цена": t.price,
    "Выручка": t.rev,
    "Себестоимость": t.cost,
    "Прибыль": t.profit,
    "Маржа %": t.margin,
    "Канал": t.ch,
    "Менеджер": t.mgr
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Sales");
  XLSX.writeFile(wb, "stroyprom_demo_data.xlsx");
}

function renderP0() {
  const f = getFiltered();
  const a = agg(f);
  const loss = calcLossPotential(f);
  
  // Monthly data
  const months = {};
  for (let m=1; m<=12; m++) months[m] = {rev:0, profit:0, qty:0};
  for (const t of f) {
    months[t.m].rev += t.rev;
    months[t.m].profit += t.profit;
    months[t.m].qty += t.qty;
  }
  const monthVals = Object.values(months).map(m => m.rev);
  const maxMonth = Math.max(...monthVals);
  const avgMonth = monthVals.reduce((x,y)=>x+y,0) / monthVals.length;
  
  // Categories
  const cats = {};
  for (const t of f) {
    if (!cats[t.cat]) cats[t.cat] = {rev:0, profit:0, qty:0, count:0, margin_sum:0};
    cats[t.cat].rev += t.rev;
    cats[t.cat].profit += t.profit;
    cats[t.cat].qty += t.qty;
    cats[t.cat].count += 1;
    cats[t.cat].margin_sum += t.margin;
  }
  const catList = Object.entries(cats).map(([k,v]) => ({...v, name:k, margin: v.margin_sum/v.count})).sort((a,b)=>b.rev-a.rev);
  const totalCatRev = catList.reduce((s,c)=>s+c.rev, 0);
  
  // Alerts (smart)
  const alerts = [];
  
  // 1. Месяцы с провалом
  const sortedMonths = Object.entries(months).sort((a,b) => a[1].rev - b[1].rev);
  for (const [m, data] of sortedMonths.slice(0,3)) {
    if (data.rev < avgMonth * 0.85) {
      const lost = Math.round(avgMonth - data.rev);
      alerts.push({t:"y", msg:`<b>${MONTHS[m-1]}</b> просел на ${Math.round((1 - data.rev/avgMonth)*100)}% относительно среднемесячного. Условная упущенная выручка: ${fK(lost)}`, p: lost});
    }
  }
  
  // 2. Слабый канал в категории
  const chCatMap = {};
  for (const t of f) {
    const key = t.cat + "|" + t.ch;
    if (!chCatMap[key]) chCatMap[key] = 0;
    chCatMap[key] += t.rev;
  }
  
  // 3. Низкомаржинальные сделки на топ-продукт
  const lowMargin = f.filter(t => t.margin < 35);
  if (lowMargin.length > 5) {
    const lostMargin = lowMargin.reduce((s,t) => s + (t.rev * 0.05), 0);
    alerts.push({t:"r", msg:`<b>${lowMargin.length} сделок</b> с маржой <35%. Если бы маржа держалась 40% — дополнительно ${fK(lostMargin)} прибыли`, p: lostMargin*2});
  }
  
  // 4. Менеджер-аутсайдер
  const mgrData = {};
  for (const t of f) {
    if (!mgrData[t.mgr]) mgrData[t.mgr] = {rev:0, profit:0, count:0};
    mgrData[t.mgr].rev += t.rev;
    mgrData[t.mgr].profit += t.profit;
    mgrData[t.mgr].count += 1;
  }
  const mgrSorted = Object.entries(mgrData).sort((a,b) => b[1].rev - a[1].rev);
  if (mgrSorted.length >= 2) {
    const best = mgrSorted[0];
    const worst = mgrSorted[mgrSorted.length-1];
    const gap = best[1].rev - worst[1].rev;
    if (gap > best[1].rev * 0.25) {
      alerts.push({t:"y", msg:`<b>${worst[0]}</b> отстаёт от лидера на ${fK(gap)}. Подтянуть до средней — дополнительно ~${fK(gap*0.4)} выручки`, p: gap});
    }
  }
  
  // 5. Концентрация рисков
  const products = {};
  for (const t of f) {
    if (!products[t.prod]) products[t.prod] = 0;
    products[t.prod] += t.rev;

function renderP1() {

  for (const t of f) {

    products[t.prod].rev += t.rev;
    products[t.prod].profit += t.profit;
    products[t.prod].qty += t.qty;
    products[t.prod].count += 1;

    if (!products[t.prod].m[t.m]) products[t.prod].m[t.m] = 0;
    products[t.prod].m[t.m] += t.rev;

  // ABC analysis
  const sorted = Object.entries(products).sort((a,b) => b[1].rev - a[1].rev);

          <div style="margin-top:14px;padding:12px;background:var(--amber-light);border-left:2px solid var(--amber);font-size:11px;color:var(--ink-3);line-height:1.5">
            <b style="color:var(--ink);display:block;margin-bottom:4px">Инсайт по каналу</b>
            Оптовый канал даёт ${fP(list[0].share)} выручки и ${fK(list[0].profit)} прибыли. Розничная точка работает в 3.3× меньше. При этом маржа в рознице на 1-2 п.п. выше — это окно роста.
          </div>
        </div>
      </div>
    </div>
    
    <div class="card" style="margin-top:18px">
      <div class="card-h">
        <div class="card-t">Категории × Каналы · матрица выручки</div>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>Категория</th>
              ${list.map(ch => `<th class="right">${ch.name}</th>`).join("")}
              <th class="right">Итого</th>
              <th class="right">Сильнее всего</th>
            </tr>
          </thead>
          <tbody>
            ${cats().map(c => {
              const row = list.map(ch => chs[ch.name].cats[c] || 0);
              const rowSum = row.reduce((s,v)=>s+v, 0);
              const maxIdx = row.indexOf(Math.max(...row));
              const maxChannel = list[maxIdx].name;
              return `<tr>
                <td style="font-weight:600">${c}</td>
                ${row.map((v,i) => `<td class="right num" style="${i===maxIdx?'font-weight:700;color:var(--green)':''}">${fK(v)}</td>`).join("")}
                <td class="right num" style="font-weight:600">${fK(rowSum)}</td>
                <td class="right" style="font-size:11px;color:var(--ink-4)">${maxChannel.split(' ')[0]}</td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function renderAll() {
  renderFbar();
  if (cur === 0) renderP0();
  if (cur === 1) renderP1();
  if (cur === 2) renderP2();
  if (cur === 3) renderP3();
}

renderNav();
showPage();
renderAll();

// Update "last upd" every minute
setInterval(() => {
  const d = new Date();
  document.getElementById("last-upd").textContent =
    d.toLocaleString("ru-RU", {day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
}, 60000);
</script>
</body>
</html>
